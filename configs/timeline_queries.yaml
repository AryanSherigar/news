budget_2026:
  start_date: "2026-01-15"
  end_date: "2026-03-15"
  source_strategy: "Guardian primary, GDELT event backfill, optional GNews/Mediastack enrichment"
  providers:
    - name: guardian
      page_size: 50
      max_pages: 3
      queries:
        - "Union Budget 2026"
        - "Budget 2026 tax slab"
        - "Nirmala Sitharaman budget speech"
        - "fiscal deficit capex"
    - name: gdelt
      max_records: 80
      queries:
        - "Union Budget 2026 OR Nirmala Sitharaman"
        - "India budget tax slab OR fiscal deficit"
    - name: gnews
      enabled_if_env: GNEWS_API_KEY
      max_records: 40
      queries:
        - "Union Budget 2026"
        - "Budget 2026 India"
    - name: mediastack
      enabled_if_env: MEDIASTACK_API_KEY
      max_records: 40
      queries:
        - "Union Budget 2026"
        - "India fiscal deficit 2026"

us_iran_conflict:
  start_date: "2025-10-01"
  end_date: "2026-03-24"
  source_strategy: "GDELT primary for event coverage, Guardian for narrative context, optional GNews/Mediastack"
  providers:
    - name: gdelt
      max_records: 120
      queries:
        - "US Iran tensions OR IRGC"
        - "US strikes Iran retaliation"
        - "Persian Gulf escalation sanctions"
    - name: guardian
      page_size: 40
      max_pages: 2
      queries:
        - "US Iran tensions"
        - "IRGC sanctions"
        - "Persian Gulf escalation"
    - name: gnews
      enabled_if_env: GNEWS_API_KEY
      max_records: 35
      queries:
        - "US Iran tensions"
        - "Iran retaliation US"
    - name: mediastack
      enabled_if_env: MEDIASTACK_API_KEY
      max_records: 35
      queries:
        - "US Iran conflict"
        - "Persian Gulf escalation"

israel_palestine_conflict:
